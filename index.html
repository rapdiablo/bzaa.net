<html>
  <head>
    <title>bzza.net</title>
    <style>
        #intro {
          position: fixed;
          inset: 0;
          z-index: 9999;
          display: grid;
          place-items: center;
          background: #000;
          color: #fff;
          font: 20px Arial, sans-serif;
          cursor: pointer;
          opacity: 1;
          transition: opacity 1s ease;
        }

        #intro.fade-out {
          opacity: 0;
          pointer-events: none;
        }
    </style>
  </head>

  <body>
    <h1>its working</h1>
    <div id="intro">
      <h1 id="enter">click to enter</h1>
    </div>
    <audio id="music" src="a.mp3" loop></audio>

    
    <script>
      const intro = document.getElementById("intro");
      const music = document.getElementById("music");

      intro.addEventListener("click", async () => {
        intro.classList.add("fade-out");

        try {
          await music.play();
        } catch (error) {
          console.error("Music couldn't start:", error);
        }

        intro.addEventListener("transitionend", () => {
          intro.remove();
          }, { once: true });
        }, { once: true });
      </script>
  </body>
</html>
